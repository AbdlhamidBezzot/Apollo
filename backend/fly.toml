app = "apollo-api"
primary_region = "iad"

build:
  dockerfile: Dockerfile

[env]
APP_ENV = "production"
COOKIE_SAMESITE = "none"
CORS_ORIGINS = "https://apollo-94zv.vercel.app"
# Attach secrets via `fly secrets set` (DATABASE_URL, REDIS_URL, TMDB_*,
# SECRET_KEY). Never commit them here.
SECRET_KEY = ""

[[services]]
name = "apollo-api"
http_checks = [{ path = "/health" }]
[[services.ports]]
handlers = ["http"]
port = 8080

[[services.processes]]
web_command = "uvicorn app.main:app --host 0.0.0.0 --port 8080 --workers 2"