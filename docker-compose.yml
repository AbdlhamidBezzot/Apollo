services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: apollo
      POSTGRES_PASSWORD: YPoDBI5XWDQTG3QHhIcb3Y7f
      POSTGRES_DB: apollo
    ports:
      - "5435:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apollo"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"

volumes:
  pgdata:
